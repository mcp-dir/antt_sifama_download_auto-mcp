# Smithery configuration for ANTT SIFAMA: Download de Auto de Infração
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_antt_sifama_download_auto

name: antt_sifama_download_auto-mcp
displayName: "ANTT SIFAMA: Download de Auto de Infração"
description: >
  ANTT SIFAMA: Download de Auto de Infração, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/antt_sifama_download_auto-mcp
repository: https://github.com/mcp-dir/antt_sifama_download_auto-mcp

tags:
  - antt_sifama_download_auto
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_antt_sifama_download_auto

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_antt_sifama_download_auto/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
